name: Build Android Library

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: 11  # AGP 7.0+ 推荐使用 JDK 17

    - name: Setup Gradle cache
      uses: gradle/gradle-build-action@v2

    - name: Build AAR
      run: ./gradlew :corekit:assembleRelease
