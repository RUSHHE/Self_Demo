name: Build Android Library (JAR)

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: 11

    - name: Setup Gradle cache
      uses: gradle/gradle-build-action@v2

    - name: Build JAR
      run: ./gradlew :corekit:makeJar

    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: corekit-jar
        path: corekit/build/libs/*.jar
